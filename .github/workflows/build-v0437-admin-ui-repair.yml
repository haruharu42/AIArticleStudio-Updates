name: Validate v0.4.3.7 Admin UI Payload Repair

on:
  pull_request:
    branches: [main]
    paths:
      - 'release/v0437/**'
      - 'candidate-v0437.json'
      - 'updates/AIArticleStudio_Update_v0.4.3.7_AdminUIPayloadRepair.zip'
      - 'scripts/test_v0437_update_repair.py'
      - '.github/workflows/build-v0437-admin-ui-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-validation:
    name: Linux focused and package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test forced payload repair from v0.4.3.4-v0.4.3.6
        run: python scripts/test_v0437_update_repair.py
      - name: Test unchanged Admin User Mode and Auth boundaries
        run: |
          python scripts/test_v0436_admin_user_mode.py
          python scripts/test_v0435_admin_user_management.py
          python scripts/test_v0434_google_oauth.py
      - name: Verify deterministic package
        run: git diff --exit-code -- candidate-v0437.json release/v0437/SHA256.txt updates/AIArticleStudio_Update_v0.4.3.7_AdminUIPayloadRepair.zip

  windows-validation:
    name: Windows real install-path validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test forced payload repair
        shell: powershell
        run: python scripts/test_v0437_update_repair.py
      - name: Test real Windows Tk buttons and mode switching
        shell: powershell
        run: python scripts/test_v0436_admin_user_mode_tk_runtime.py --require-display
      - name: Run Update.ps1 against a stale v0.4.3.6 LocalAppData install
        shell: powershell
        run: |
          $fixtureBase = Join-Path $env:RUNNER_TEMP 'v0437-real-install'
          $appRoot = Join-Path $fixtureBase 'AIArticleStudio'
          $packageRoot = Join-Path $env:RUNNER_TEMP 'v0437-real-package'
          python -c "import pathlib,sys; sys.path.insert(0, str(pathlib.Path.cwd() / 'scripts')); import test_v0437_update_repair as test; test.build_v0436_stale_fixture(pathlib.Path(r'$fixtureBase'))"
          python -m venv (Join-Path $appRoot '.venv')
          Expand-Archive -Path '.\updates\AIArticleStudio_Update_v0.4.3.7_AdminUIPayloadRepair.zip' -DestinationPath $packageRoot -Force
          $authUi = Join-Path $appRoot 'src\ai_article_studio\ui\auth_ui.py'
          $before = (Get-FileHash $authUi -Algorithm SHA256).Hash
          $savedLocalAppData = $env:LOCALAPPDATA
          try {
            $env:LOCALAPPDATA = $fixtureBase
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $packageRoot 'Update.ps1')
          } finally {
            $env:LOCALAPPDATA = $savedLocalAppData
          }
          $after = (Get-FileHash $authUi -Algorithm SHA256).Hash
          $payload = (Get-FileHash (Join-Path $packageRoot 'payload\ui\auth_ui.py') -Algorithm SHA256).Hash
          if ($before -eq $after) { throw 'Stale installed auth_ui.py was not replaced.' }
          if ($after -ne $payload) { throw 'Installed auth_ui.py does not match the ZIP payload.' }
          & (Join-Path $appRoot '.venv\Scripts\python.exe') (Join-Path $packageRoot 'validate_v0437.py') $appRoot $packageRoot
      - name: Parse candidate with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate_windows.ps1 -ManifestPath .\candidate-v0437.json
      - name: Verify deterministic package
        shell: powershell
        run: git diff --exit-code -- candidate-v0437.json release/v0437/SHA256.txt updates/AIArticleStudio_Update_v0.4.3.7_AdminUIPayloadRepair.zip
