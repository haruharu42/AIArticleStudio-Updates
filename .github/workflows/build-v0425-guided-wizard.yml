name: Validate v0.4.2.5 guided wizard and history

on:
  pull_request:
    branches: [main]
    paths:
      - 'release/v0425/**'
      - 'candidate-v0425.json'
      - 'updates/AIArticleStudio_Update_v0.4.2.5_GuidedWizardHistory.zip'
      - 'scripts/test_phase36_complete.py'
      - 'scripts/test_v0425_guided_wizard.py'
      - '.github/workflows/build-v0425-guided-wizard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-validation:
    name: Linux package and workflow validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run wizard and history regression tests
        run: |
          python scripts/test_phase36_complete.py
          python scripts/test_v0424_image_planning.py
          python scripts/test_v0425_guided_wizard.py
      - name: Validate v0.4.2.5 candidate
        run: python scripts/validate_release.py candidate-v0425.json

  windows-validation:
    name: Windows PowerShell 5.1 validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run wizard and history regression tests
        shell: powershell
        run: |
          python scripts/test_phase36_complete.py
          python scripts/test_v0424_image_planning.py
          python scripts/test_v0425_guided_wizard.py
      - name: Validate v0.4.2.5 candidate
        shell: powershell
        run: python scripts/validate_release.py candidate-v0425.json
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate_windows.ps1 -ManifestPath .\candidate-v0425.json
