name: Validate v0.4.3.2 Markdown-safe publish flow

on:
  pull_request:
    branches: [main]
    paths:
      - 'release/v0432/**'
      - 'candidate-v0432.json'
      - 'updates/AIArticleStudio_Update_v0.4.3.2_MarkdownSafePublish.zip'
      - 'src/ai_article_studio/core/article_publish_text.py'
      - 'src/ai_article_studio/core/web_ai_workflow.py'
      - 'src/ai_article_studio/core/web_ai_ui_bridge.py'
      - 'src/ai_article_studio/core/image_prompt_builder.py'
      - 'src/ai_article_studio/ui/guided_wizard_v0432.py'
      - 'scripts/test_v0432_publish_copy.py'
      - 'scripts/test_v0432_update_package.py'
      - 'scripts/test_v0432_publish_copy_tk_runtime.py'
      - '.github/workflows/build-v0432-markdown-safe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-validation:
    name: Linux patch, table, and package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test publish-copy behavior
        run: python scripts/test_v0432_publish_copy.py
      - name: Test update paths and package
        run: python scripts/test_v0432_update_package.py
      - name: Verify deterministic package
        run: git diff --exit-code -- candidate-v0432.json release/v0432/SHA256.txt updates/AIArticleStudio_Update_v0.4.3.2_MarkdownSafePublish.zip

  windows-validation:
    name: Windows PowerShell and real Tk validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test publish-copy behavior
        shell: powershell
        run: python scripts/test_v0432_publish_copy.py
      - name: Test update paths and package
        shell: powershell
        run: python scripts/test_v0432_update_package.py
      - name: Test real same-window publish-copy flow
        shell: powershell
        run: python scripts/test_v0432_publish_copy_tk_runtime.py --require-display
      - name: Parse candidate with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate_windows.ps1 -ManifestPath .\candidate-v0432.json
      - name: Verify deterministic package
        shell: powershell
        run: git diff --exit-code -- candidate-v0432.json release/v0432/SHA256.txt updates/AIArticleStudio_Update_v0.4.3.2_MarkdownSafePublish.zip
