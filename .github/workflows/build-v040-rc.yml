name: Build v0.4.0 RC package

on:
  push:
    branches: [phase35-v040-rc1]
    paths:
      - 'release/v040/**'
      - 'src/ai_article_studio/core/**'
      - 'scripts/phase35_v040_preflight.py'
      - '.github/workflows/build-v040-rc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v040:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC branch
        uses: actions/checkout@v4
        with:
          ref: phase35-v040-rc1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Phase 3.5 tests
        run: |
          python scripts/test_phase35_core.py
          python scripts/test_phase35_workflow.py
          python scripts/phase35_v040_preflight.py --self-test

      - name: Build v0.4.0 package
        run: python release/v040/build_package.py

      - name: Validate candidate package
        run: python scripts/validate_release.py candidate-v040.json

      - name: Commit generated RC package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidate-v040.json release/v040/SHA256.txt updates/AIArticleStudio_Update_v0.4.0_Phase35WebAIProduction.zip
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build v0.4.0 Phase 3.5 RC package [skip build-v040]"
            git push origin HEAD:phase35-v040-rc1
          fi
