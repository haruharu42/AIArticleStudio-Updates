name: PWA Production Preflight

on:
  pull_request:
    branches:
      - main
    paths:
      - "pwa/**"
      - "scripts/Prepare-AAS-PWA-Production.ps1"
      - "docs/pwa-production-rollout.md"
      - ".github/workflows/pwa-production-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-production-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: pwa
    env:
      NEXT_PUBLIC_AAS_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_AAS_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_public_only
      NEXT_PUBLIC_AAS_TERMS_URL: https://example.com/terms
      NEXT_PUBLIC_AAS_PRIVACY_URL: https://example.com/privacy
      NEXT_PUBLIC_AAS_AI_TERMS_URL: https://example.com/ai-terms
      AAS_CLOUDFLARE_WORKER_NAME: ai-article-studio-pwa-ci
      WRANGLER_WRITE_LOGS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build and regression tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Validate PWA assets and auth cache exclusions
        shell: bash
        run: |
          set -euo pipefail
          test -f public/manifest.webmanifest
          test -f public/icon-192.png
          test -f public/icon-512.png
          test -f public/sw.js
          grep -Fq '/auth/callback' public/sw.js
          grep -Fq '/api/' public/sw.js
          grep -Fq 'access_token' public/sw.js
          grep -Fq 'refresh_token' public/sw.js
          grep -Fq 'aas-pwa-phase17-prod-v1' public/sw.js
          if grep -Fq 'aas-pwa-phase8-v1' public/sw.js; then
            echo 'Stale Phase 8 production cache generation remains.' >&2
            exit 1
          fi

      - name: Locate generated Wrangler deployment config
        id: wrangler-config
        shell: bash
        run: |
          set -euo pipefail
          config="$(find . \
            -path './node_modules' -prune -o \
            -path './.wrangler' -prune -o \
            -name wrangler.json -type f -print | head -n 1)"
          if [ -z "$config" ]; then
            echo 'Generated wrangler.json was not found after the production build.' >&2
            exit 1
          fi
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "Generated Wrangler config found."

      - name: Verify required Cloudflare bindings
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = process.env.CONFIG_PATH;
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!config.name) throw new Error('Worker name missing');
          if (!config.compatibility_date) throw new Error('compatibility_date missing');
          if (config.assets?.binding !== 'ASSETS') throw new Error('ASSETS binding missing');
          const imagesBinding = Array.isArray(config.images)
            ? config.images.some((item) => item?.binding === 'IMAGES')
            : config.images?.binding === 'IMAGES';
          if (!imagesBinding) throw new Error('IMAGES binding missing');
          const serialized = JSON.stringify(config);
          if (/sb_secret_|service[_-]?role/i.test(serialized)) {
            throw new Error('Secret/service-role marker found in generated Worker config');
          }
          console.log('Cloudflare deployment contract: PASS');
          NODE
        env:
          CONFIG_PATH: ${{ steps.wrangler-config.outputs.config }}

      - name: Wrangler deployment dry-run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .production-dry-run
          npx wrangler deploy \
            --dry-run \
            --config "${{ steps.wrangler-config.outputs.config }}" \
            --outdir .production-dry-run
          test -d .production-dry-run
          echo 'Wrangler deployment dry-run: PASS'

  windows-production-helper:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Validate helper syntax with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\scripts\Prepare-AAS-PWA-Production.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List
            throw 'Production preflight helper has PowerShell syntax errors'
          }
          Write-Host 'PowerShell 5.1 syntax: PASS'

      - name: Run production helper against public-only fixture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:RUNNER_TEMP 'AIArticleStudio'
          $configRoot = Join-Path $installRoot 'config'
          New-Item -ItemType Directory -Path $configRoot -Force | Out-Null

          [ordered]@{
            supabase_url = 'https://ci-placeholder.supabase.co'
            anon_key = 'sb_publishable_ci_public_only'
            terms_url = 'https://example.com/terms'
            privacy_url = 'https://example.com/privacy'
            ai_terms_url = 'https://example.com/ai-terms'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $configRoot 'auth.json') -Encoding UTF8

          & '.\scripts\Prepare-AAS-PWA-Production.ps1' `
            -RepoRoot (Get-Location).Path `
            -InstallRoot $installRoot `
            -ExpectedGitRef 'HEAD'

          if ($LASTEXITCODE -ne 0) {
            throw 'Production preflight helper failed'
          }
