name: PWA Production Preflight

on:
  pull_request:
    branches:
      - main
    paths:
      - "pwa/**"
      - "scripts/Prepare-AAS-PWA-Production.ps1"
      - "scripts/Test-AAS-Cloudflare-Connection.ps1"
      - "scripts/Test-AAS-Cloudflare-Worker-Name.ps1"
      - "scripts/Publish-AAS-PWA-Preview-Version.ps1"
      - "scripts/Bootstrap-AAS-PWA-Preview-Worker.ps1"
      - "docs/pwa-production-rollout.md"
      - ".github/workflows/pwa-production-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-production-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: pwa
    env:
      NEXT_PUBLIC_AAS_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_AAS_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_public_only
      NEXT_PUBLIC_AAS_TERMS_URL: /terms
      NEXT_PUBLIC_AAS_PRIVACY_URL: /privacy
      NEXT_PUBLIC_AAS_AI_TERMS_URL: /ai-terms
      AAS_CLOUDFLARE_WORKER_NAME: ai-article-studio-pwa-ci
      WRANGLER_WRITE_LOGS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build and regression tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Validate PWA assets and auth cache exclusions
        shell: bash
        run: |
          set -euo pipefail
          test -f public/manifest.webmanifest
          test -f public/icon-192.png
          test -f public/icon-512.png
          test -f public/sw.js
          test -f app/terms/page.tsx
          test -f app/privacy/page.tsx
          test -f app/ai-terms/page.tsx
          grep -Fq '/auth/callback' public/sw.js
          grep -Fq '/api/' public/sw.js
          grep -Fq 'access_token' public/sw.js
          grep -Fq 'refresh_token' public/sw.js
          grep -Fq 'aas-pwa-phase17-prod-v1' public/sw.js
          if grep -Fq 'aas-pwa-phase8-v1' public/sw.js; then
            echo 'Stale Phase 8 production cache generation remains.' >&2
            exit 1
          fi

      - name: Locate generated Wrangler deployment config
        id: wrangler-config
        shell: bash
        run: |
          set -euo pipefail
          config="$(find . \
            -path './node_modules' -prune -o \
            -path './.wrangler' -prune -o \
            -name wrangler.json -type f -print | head -n 1)"
          if [ -z "$config" ]; then
            echo 'Generated wrangler.json was not found after the production build.' >&2
            exit 1
          fi
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "Generated Wrangler config found."

      - name: Verify required Cloudflare bindings and preview routing
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = process.env.CONFIG_PATH;
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!config.name) throw new Error('Worker name missing');
          if (!config.compatibility_date) throw new Error('compatibility_date missing');
          if (config.workers_dev !== false) throw new Error('workers_dev must remain disabled during preview preparation');
          if (config.preview_urls !== true) throw new Error('preview_urls must be explicitly enabled');
          if (config.assets?.binding !== 'ASSETS') throw new Error('ASSETS binding missing');
          const imagesBinding = Array.isArray(config.images)
            ? config.images.some((item) => item?.binding === 'IMAGES')
            : config.images?.binding === 'IMAGES';
          if (!imagesBinding) throw new Error('IMAGES binding missing');
          if (config.route || (Array.isArray(config.routes) && config.routes.length > 0)) {
            throw new Error('production routes must be absent during preview preparation');
          }
          const serialized = JSON.stringify(config);
          if (/sb_secret_|service[_-]?role/i.test(serialized)) {
            throw new Error('Secret/service-role marker found in generated Worker config');
          }
          console.log('Cloudflare preview deployment contract: PASS');
          NODE
        env:
          CONFIG_PATH: ${{ steps.wrangler-config.outputs.config }}

      - name: Wrangler deployment dry-run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .production-dry-run
          npx wrangler deploy \
            --dry-run \
            --config "${{ steps.wrangler-config.outputs.config }}" \
            --outdir .production-dry-run
          test -d .production-dry-run
          echo 'Wrangler deployment dry-run: PASS'

  windows-production-helper:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Validate helper syntax with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($relativePath in @(
            '.\scripts\Prepare-AAS-PWA-Production.ps1',
            '.\scripts\Test-AAS-Cloudflare-Connection.ps1',
            '.\scripts\Test-AAS-Cloudflare-Worker-Name.ps1',
            '.\scripts\Publish-AAS-PWA-Preview-Version.ps1',
            '.\scripts\Bootstrap-AAS-PWA-Preview-Worker.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $relativePath),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | Format-List
              throw "$relativePath has PowerShell syntax errors"
            }
          }
          Write-Host 'PowerShell 5.1 helper syntax: PASS'

      - name: Validate Cloudflare connection checker safety
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content -LiteralPath '.\scripts\Test-AAS-Cloudflare-Connection.ps1' -Raw -Encoding UTF8
          if ($source -notmatch 'whoami\s+--json') {
            throw 'Connection checker must verify Wrangler authentication with whoami --json'
          }
          if ($source -notmatch 'login\s+--use-keyring') {
            throw 'Connection checker must opt in to OS-keyring credential storage'
          }
          if ($source -match '(?i)&\s+\$WranglerCmd\s+deploy\b') {
            throw 'Connection checker must never invoke wrangler deploy'
          }
          if ($source -match '(?i)sb_secret_|service[_-]?role') {
            throw 'Connection checker contains a forbidden secret marker'
          }
          Write-Host 'Cloudflare connection checker safety: PASS'

      - name: Validate Cloudflare Worker-name checker safety
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content -LiteralPath '.\scripts\Test-AAS-Cloudflare-Worker-Name.ps1' -Raw -Encoding UTF8
          if ($source -notmatch 'versions\s+list') {
            throw 'Worker-name checker must use a read-only versions list command'
          }
          if ($source -match '(?i)&\s+\$Wrangler\s+deploy\b') {
            throw 'Worker-name checker must never invoke wrangler deploy'
          }
          if ($source -notmatch 'ErrorActionPreference\s*=\s*"Continue"') {
            throw 'Worker-name checker must safely capture native stderr under Windows PowerShell 5.1'
          }
          if ($source -match '(?i)sb_secret_|service[_-]?role') {
            throw 'Worker-name checker contains a forbidden secret marker'
          }
          Write-Host 'Cloudflare Worker-name checker safety: PASS'

      - name: Validate preview-version publisher safety
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content -LiteralPath '.\scripts\Publish-AAS-PWA-Preview-Version.ps1' -Raw -Encoding UTF8
          if ($source -notmatch 'ConfirmPreviewUpload') {
            throw 'Preview publisher must require an explicit confirmation switch'
          }
          if ($source -notmatch '(?s)"versions"\s*,\s*"upload"') {
            throw 'Preview publisher must use wrangler versions upload'
          }
          if ($source -notmatch 'preview-alias') {
            throw 'Preview publisher must create an explicit preview alias'
          }
          if ($source -match '(?i)&\s+\$Wrangler\s+deploy(?!\s+--dry-run)') {
            throw 'Preview publisher must not perform a production deployment'
          }
          if ($source -notmatch 'service\[_-\]\?role|sb_secret_') {
            throw 'Preview publisher must reject secret/service-role material before build or upload'
          }
          Write-Host 'Cloudflare preview-version publisher safety: PASS'

      - name: Validate first-worker bootstrap safety
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content -LiteralPath '.\scripts\Bootstrap-AAS-PWA-Preview-Worker.ps1' -Raw -Encoding UTF8
          if ($source -notmatch 'ConfirmBootstrapDeploy') {
            throw 'Bootstrap helper must require an explicit confirmation switch'
          }
          if ($source -notmatch '(?s)"versions"\s*,\s*"list"') {
            throw 'Bootstrap helper must verify that the Worker does not already exist'
          }
          if ($source -notmatch 'workers_dev must be false') {
            throw 'Bootstrap helper must enforce workers_dev=false'
          }
          if ($source -notmatch 'preview_urls must be true') {
            throw 'Bootstrap helper must enforce preview_urls=true'
          }
          if ($source -notmatch 'Production routes must be absent') {
            throw 'Bootstrap helper must reject production routes'
          }
          if ($source -notmatch 'deploy.+--dry-run') {
            throw 'Bootstrap helper must run a dry-run before the first write'
          }
          if ($source -notmatch 'Invoke-WranglerCapture\s+\$Wrangler\s+@\("deploy"') {
            throw 'Bootstrap helper must use the guarded Wrangler capture for the first deployment'
          }
          if ($source -notmatch 'service\[_-\]\?role|sb_secret_') {
            throw 'Bootstrap helper must reject secret/service-role material'
          }
          Write-Host 'Cloudflare first-worker bootstrap safety: PASS'

      - name: Run production helper against first-party legal routes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:RUNNER_TEMP 'AIArticleStudio'
          $configRoot = Join-Path $installRoot 'config'
          New-Item -ItemType Directory -Path $configRoot -Force | Out-Null

          [ordered]@{
            supabase_url = 'https://ci-placeholder.supabase.co'
            anon_key = 'sb_publishable_ci_public_only'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $configRoot 'auth.json') -Encoding UTF8

          & '.\scripts\Prepare-AAS-PWA-Production.ps1' `
            -RepoRoot (Get-Location).Path `
            -InstallRoot $installRoot `
            -ExpectedGitRef 'HEAD'

          if ($LASTEXITCODE -ne 0) {
            throw 'Production preflight helper failed'
          }
