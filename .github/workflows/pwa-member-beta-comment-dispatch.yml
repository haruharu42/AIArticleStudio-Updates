name: "Member Beta deploy command"

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  pull-requests: read
  issues: read

jobs:
  dispatch-member-beta:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/deploy-member-beta' &&
      github.actor == github.repository_owner &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch guarded Member Beta workflow for merged PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.issue.number;

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
            });

            if (!pr.merged || pr.base.ref !== 'main') {
              core.setFailed(`PR #${pull_number} must be merged into main before Member Beta deploy.`);
              return;
            }

            const { data: mainRef } = await github.rest.git.getRef({
              owner,
              repo,
              ref: 'heads/main',
            });

            const mainSha = mainRef.object.sha;
            const mergeSha = pr.merge_commit_sha;

            if (!/^[0-9a-f]{40}$/.test(mainSha) || !/^[0-9a-f]{40}$/.test(mergeSha ?? '')) {
              core.setFailed('Unexpected main or merge SHA.');
              return;
            }

            if (mainSha !== mergeSha) {
              core.setFailed(
                `main moved after PR #${pull_number} merged. Current main: ${mainSha}; PR merge: ${mergeSha}. Refusing stale Member Beta deploy.`,
              );
              return;
            }

            core.info(`Dispatching Member Beta workflow for merged PR #${pull_number}`);
            core.info(`SHA: ${mainSha}`);

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'pwa-member-beta-deploy.yml',
              ref: 'main',
              inputs: {
                expected_sha: mainSha,
                confirmation: 'DEPLOY_MEMBER_BETA',
              },
            });

            core.notice(`Member Beta dispatch requested for ${mainSha}.`);
