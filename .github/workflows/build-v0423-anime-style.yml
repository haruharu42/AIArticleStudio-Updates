name: Build v0.4.2.3 anime style tuning

on:
  pull_request:
    branches: [main]
    paths:
      - 'release/v0423/**'
      - 'src/ai_article_studio/core/image_prompt_builder.py'
      - 'scripts/test_v0423_anime_style.py'
      - '.github/workflows/build-v0423-anime-style.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-build-and-commit:
    # This builder is frozen for the historical v0.4.2.3 branch. Later image
    # releases share core modules and must not rebuild the immutable v0.4.2.3 ZIP.
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature-v0423-anime-style-tuning'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'feature-v0423-anime-style-tuning' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test existing Phase 3.6 core
        run: python scripts/test_phase36_complete.py
      - name: Test v0.4.2.3 anime style
        run: python scripts/test_v0423_anime_style.py
      - name: Build deterministic package
        run: python release/v0423/build_package.py
      - name: Validate candidate package
        run: python scripts/validate_release.py candidate-v0423.json
      - name: Rebuild and verify deterministic SHA
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$(python -c "import json; print(json.load(open('candidate-v0423.json', encoding='utf-8'))['sha256'])")
          python release/v0423/build_package.py >/dev/null
          SECOND=$(python -c "import json; print(json.load(open('candidate-v0423.json', encoding='utf-8'))['sha256'])")
          test "$FIRST" = "$SECOND"
      - name: Commit generated package and manifest
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/AIArticleStudio_Update_v0.4.2.3_AnimeStyleTuning.zip candidate-v0423.json release/v0423/SHA256.txt
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Build v0.4.2.3 anime style tuning package"
          git fetch origin "${{ github.head_ref }}"
          git rebase "origin/${{ github.head_ref }}"
          git push origin HEAD:${{ github.head_ref }}

  windows-validation:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature-v0423-anime-style-tuning'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test existing Phase 3.6 core
        shell: powershell
        run: python scripts/test_phase36_complete.py
      - name: Test v0.4.2.3 anime style
        shell: powershell
        run: python scripts/test_v0423_anime_style.py
      - name: Build deterministic package
        shell: powershell
        run: python release/v0423/build_package.py
      - name: Validate package
        shell: powershell
        run: python scripts/validate_release.py candidate-v0423.json
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate_windows.ps1 -ManifestPath .\candidate-v0423.json
