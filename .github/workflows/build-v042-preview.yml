name: Build v0.4.2 preview package

on:
  pull_request:
    branches: [main]
    paths:
      - 'release/v042/**'
      - 'src/ai_article_studio/core/image_*.py'
      - 'src/ai_article_studio/core/gpu_diagnostic.py'
      - 'src/ai_article_studio/core/web_ai_state.py'
      - 'src/ai_article_studio/core/web_ai_workflow.py'
      - 'src/ai_article_studio/core/web_ai_ui_bridge.py'
      - 'scripts/test_phase36_complete.py'
      - 'scripts/test_v042_patch_compat.py'
      - '.github/workflows/build-v042-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'phase36-v042-complete' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Phase 3.6 Step 1
        run: python scripts/test_phase36_step1.py
      - name: Test Phase 3.6 complete core
        run: python scripts/test_phase36_complete.py
      - name: Test v0.4.2 patch compatibility
        run: python scripts/test_v042_patch_compat.py
      - name: Build package
        run: python release/v042/build_package.py
      - name: Validate candidate package
        run: python scripts/validate_release.py candidate-v042.json
      - name: Commit generated package and manifest
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/AIArticleStudio_Update_v0.4.2_Phase36ImageWorkflow.zip candidate-v042.json release/v042/SHA256.txt
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Build v0.4.2 Phase 3.6 preview package"
          git push origin HEAD:${{ github.head_ref }}
