      - name: Test v0.4.2 patch compatibility
        shell: powershell
        run: python scripts/test_v042_patch_compat.py
      - name: Test v0.4.2.1 hotfix compatibility
        shell: powershell
        run: python scripts/test_v0421_hotfix.py
      - name: Test v0.4.2.2 article-linked images
        shell: powershell
        run: python scripts/test_v0422_image_linkage.py
      - name: Test v0.4.2.3 anime style
        shell: powershell
        run: python scripts/test_v0423_anime_style.py
      - name: Test v0.4.2.4 image planning
        shell: powershell
        run: python scripts/test_v0424_image_planning.py
      - name: Test v0.4.2.5 guided wizard and history
        shell: powershell
        run: python scripts/test_v0425_guided_wizard.py
      - name: Test v0.4.2.6 embedded single-item wizard
        shell: powershell
        run: python scripts/test_v0426_embedded_wizard.py
      - name: Test v0.4.2.7 visual six-step wizard
        shell: powershell
        run: python scripts/test_v0427_visual_wizard.py
      - name: Parse stable package with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate_windows.ps1 -ManifestPath .\latest.json
      - name: Parse v0.4.0 candidate with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate_windows.ps1 -ManifestPath .\candidate-v040.json
      - name: Parse v0.4.0.1 bridge with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate_windows.ps1 -ManifestPath .\latest-v0401.json
      - name: Parse v0.4.1 candidate with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate_windows.ps1 -ManifestPath .\candidate-v041.json
      - name: Parse v0.4.2 candidate with Windows PowerShell 5.1
        if: ${{ hashFiles('candidate-v042.json') != '' }}
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate_windows.ps1 -ManifestPath .\candidate-v042.json
      - name: Parse v0.4.2.1 candidate with Windows PowerShell 5.1
        if: ${{ hashFiles('candidate-v0421.json') != '' }}
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate_windows.ps1 -ManifestPath .\candidate-v0421.json
      - name: Parse v0.4.2.2 candidate with Windows PowerShell 5.1
