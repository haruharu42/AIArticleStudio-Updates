name: Validate update release

on:
  push:
    branches: [main]
    paths:
      - 'latest*.json'
      - 'candidate-v040.json'
      - 'candidate-v041.json'
      - 'candidate-v042.json'
      - 'candidate-v0421.json'
      - 'candidate-v0422.json'
      - 'candidate-v0423.json'
      - 'candidate-v0424.json'
      - 'candidate-v0425.json'
      - 'candidate-v0426.json'
      - 'candidate-v0427.json'
      - 'updates/**'
      - 'release/v040/**'
      - 'release/v0401/**'
      - 'release/v041/**'
      - 'release/v042/**'
      - 'release/v0421/**'
      - 'release/v0422/**'
      - 'release/v0423/**'
      - 'release/v0424/**'
      - 'release/v0425/**'
      - 'release/v0426/**'
      - 'release/v0427/**'
      - 'scripts/**'
      - 'config/**'
      - 'src/**'
      - '.github/workflows/validate-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'latest*.json'
      - 'candidate-v040.json'
      - 'candidate-v041.json'
      - 'candidate-v042.json'
      - 'candidate-v0421.json'
      - 'candidate-v0422.json'
      - 'candidate-v0423.json'
      - 'candidate-v0424.json'
      - 'candidate-v0425.json'
      - 'candidate-v0426.json'
      - 'candidate-v0427.json'
      - 'updates/**'
      - 'release/v040/**'
      - 'release/v0401/**'
      - 'release/v041/**'
      - 'release/v042/**'
      - 'release/v0421/**'
      - 'release/v0422/**'
      - 'release/v0423/**'
      - 'release/v0424/**'
      - 'release/v0425/**'
      - 'release/v0426/**'
      - 'release/v0427/**'
      - 'scripts/**'
      - 'config/**'
      - 'src/**'
      - '.github/workflows/validate-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-package:
    name: ZIP / SHA256 / Python validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate latest release
        run: python scripts/validate_release.py latest.json
      - name: Validate v0.4.0 candidate
        run: python scripts/validate_release.py candidate-v040.json
      - name: Validate v0.4.0.1 bridge package
        run: python scripts/validate_release.py latest-v0401.json
      - name: Validate v0.4.1 candidate
        run: python scripts/validate_release.py candidate-v041.json
      - name: Validate v0.4.2 candidate
        if: ${{ hashFiles('candidate-v042.json') != '' }}
        run: python scripts/validate_release.py candidate-v042.json
      - name: Validate v0.4.2.1 candidate
        if: ${{ hashFiles('candidate-v0421.json') != '' }}
        run: python scripts/validate_release.py candidate-v0421.json
      - name: Validate v0.4.2.2 candidate
        if: ${{ hashFiles('candidate-v0422.json') != '' }}
        run: python scripts/validate_release.py candidate-v0422.json
      - name: Validate v0.4.2.3 candidate
        if: ${{ hashFiles('candidate-v0423.json') != '' }}
        run: python scripts/validate_release.py candidate-v0423.json
      - name: Validate v0.4.2.4 candidate
        if: ${{ hashFiles('candidate-v0424.json') != '' }}
        run: python scripts/validate_release.py candidate-v0424.json
      - name: Validate v0.4.2.5 candidate
        if: ${{ hashFiles('candidate-v0425.json') != '' }}
        run: python scripts/validate_release.py candidate-v0425.json
      - name: Validate v0.4.2.6 candidate
        if: ${{ hashFiles('candidate-v0426.json') != '' }}
        run: python scripts/validate_release.py candidate-v0426.json
      - name: Validate v0.4.2.7 candidate
        if: ${{ hashFiles('candidate-v0427.json') != '' }}
        run: python scripts/validate_release.py candidate-v0427.json
      - name: Test Phase 3.5 core
        run: python scripts/test_phase35_core.py
      - name: Test Phase 3.5 integrated workflow
        run: python scripts/test_phase35_workflow.py
      - name: Test Web Prompt Engine v2
        run: python scripts/test_web_prompt_v2.py
      - name: Test Phase 3.6 Step 1 image core
        run: python scripts/test_phase36_step1.py
      - name: Test Phase 3.6 complete image core
        run: python scripts/test_phase36_complete.py
      - name: Test v0.4.0 UI preflight
        run: python scripts/phase35_v040_preflight.py --self-test
      - name: Test v0.4.0 patch compatibility
        run: python scripts/test_v040_patch_compat.py
      - name: Test v0.4.0.1 bridge compatibility
        run: python scripts/test_v0401_bridge.py
      - name: Test v0.4.1 patch compatibility
        run: python scripts/test_v041_patch_compat.py
      - name: Test v0.4.2 patch compatibility
        run: python scripts/test_v042_patch_compat.py
      - name: Test v0.4.2.1 hotfix compatibility
        run: python scripts/test_v0421_hotfix.py
      - name: Test v0.4.2.2 article-linked images
        run: python scripts/test_v0422_image_linkage.py
      - name: Test v0.4.2.3 anime style
        run: python scripts/test_v0423_anime_style.py
      - name: Test v0.4.2.4 image planning
        run: python scripts/test_v0424_image_planning.py
      - name: Test v0.4.2.5 guided wizard and history
        run: python scripts/test_v0425_guided_wizard.py
      - name: Test v0.4.2.6 embedded single-item wizard
        run: python scripts/test_v0426_embedded_wizard.py
      - name: Test v0.4.2.7 visual six-step wizard
        run: python scripts/test_v0427_visual_wizard.py

  validate-windows-powershell51:
    name: Windows PowerShell 5.1 validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate latest package with Python
        shell: powershell
        run: python scripts/validate_release.py latest.json
      - name: Validate v0.4.0 candidate with Python
        shell: powershell
        run: python scripts/validate_release.py candidate-v040.json
      - name: Validate v0.4.0.1 bridge package with Python
        shell: powershell
        run: python scripts/validate_release.py latest-v0401.json
      - name: Validate v0.4.1 candidate with Python
        shell: powershell
        run: python scripts/validate_release.py candidate-v041.json
      - name: Validate v0.4.2 candidate with Python
        if: ${{ hashFiles('candidate-v042.json') != '' }}
        shell: powershell
        run: python scripts/validate_release.py candidate-v042.json
      - name: Validate v0.4.2.1 candidate with Python
        if: ${{ hashFiles('candidate-v0421.json') != '' }}
        shell: powershell
        run: python scripts/validate_release.py candidate-v0421.json
      - name: Validate v0.4.2.2 candidate with Python
        if: ${{ hashFiles('candidate-v0422.json') != '' }}
        shell: powershell
        run: python scripts/validate_release.py candidate-v0422.json
      - name: Validate v0.4.2.3 candidate with Python
        if: ${{ hashFiles('candidate-v0423.json') != '' }}
        shell: powershell
        run: python scripts/validate_release.py candidate-v0423.json
      - name: Validate v0.4.2.4 candidate with Python
        if: ${{ hashFiles('candidate-v0424.json') != '' }}
        shell: powershell
        run: python scripts/validate_release.py candidate-v0424.json
      - name: Validate v0.4.2.5 candidate with Python
        if: ${{ hashFiles('candidate-v0425.json') != '' }}
