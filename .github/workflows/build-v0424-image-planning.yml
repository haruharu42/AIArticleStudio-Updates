name: Validate v0.4.2.4 image planning

on:
  pull_request:
    branches: [main]
    paths:
      - 'release/v0424/**'
      - 'candidate-v0424.json'
      - 'updates/AIArticleStudio_Update_v0.4.2.4_ImagePlanning.zip'
      - 'src/ai_article_studio/core/image_settings.py'
      - 'src/ai_article_studio/core/image_prompt_builder.py'
      - 'src/ai_article_studio/core/web_ai_workflow.py'
      - 'src/ai_article_studio/core/web_prompt_engine_v2.py'
      - 'scripts/test_v0424_image_planning.py'
      - '.github/workflows/build-v0424-image-planning.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-validation:
    name: Linux package and workflow validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run image workflow regression tests
        run: |
          python scripts/test_phase36_complete.py
          python scripts/test_v0423_anime_style.py
          python scripts/test_v0424_image_planning.py
      - name: Rebuild deterministic package
        run: python release/v0424/build_package.py
      - name: Validate v0.4.2.4 candidate
        run: python scripts/validate_release.py candidate-v0424.json
      - name: Verify committed package is reproducible
        run: git diff --exit-code -- candidate-v0424.json release/v0424/SHA256.txt updates/AIArticleStudio_Update_v0.4.2.4_ImagePlanning.zip

  windows-validation:
    name: Windows PowerShell 5.1 validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run image workflow regression tests
        shell: powershell
        run: |
          python scripts/test_phase36_complete.py
          python scripts/test_v0423_anime_style.py
          python scripts/test_v0424_image_planning.py
      - name: Rebuild deterministic package
        shell: powershell
        run: python release/v0424/build_package.py
      - name: Validate v0.4.2.4 candidate
        shell: powershell
        run: python scripts/validate_release.py candidate-v0424.json
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate_windows.ps1 -ManifestPath .\candidate-v0424.json
      - name: Verify committed package is reproducible
        shell: powershell
        run: git diff --exit-code -- candidate-v0424.json release/v0424/SHA256.txt updates/AIArticleStudio_Update_v0.4.2.4_ImagePlanning.zip
