name: Build v0.4.0.1 bridge package

on:
  push:
    branches: [main]
    paths:
      - 'release/v0401/**'
      - 'scripts/test_v0401_bridge.py'
      - '.github/workflows/build-v0401-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run bridge regression test
        run: python scripts/test_v0401_bridge.py

      - name: Build bridge package
        run: python release/v0401/build_bridge_package.py

      - name: Validate generated bridge manifest
        run: python scripts/validate_release.py latest-v0401.json

      - name: Commit generated package and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/AIArticleStudio_Update_v0.4.0.1_Phase35BridgeFix.zip latest-v0401.json release/v0401/SHA256.txt
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Build v0.4.0.1 Phase 3.5 bridge package"
          git push origin HEAD:main
