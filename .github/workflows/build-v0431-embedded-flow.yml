name: Validate v0.4.3.1 embedded six-step flow

on:
  pull_request:
    branches: [main]
    paths:
      - 'release/v0431/**'
      - 'candidate-v0431.json'
      - 'updates/AIArticleStudio_Update_v0.4.3.1_EmbeddedSixStepFlow.zip'
      - 'src/ai_article_studio/ui/guided_wizard_v0427.py'
      - 'src/ai_article_studio/ui/guided_wizard_v0431.py'
      - 'scripts/test_v0431_embedded_flow.py'
      - 'scripts/test_v0431_embedded_flow_tk_runtime.py'
      - '.github/workflows/build-v0431-embedded-flow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-validation:
    name: Linux patch and package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test embedded flow patch and package
        run: python scripts/test_v0431_embedded_flow.py
      - name: Verify deterministic package
        run: git diff --exit-code -- candidate-v0431.json release/v0431/SHA256.txt updates/AIArticleStudio_Update_v0.4.3.1_EmbeddedSixStepFlow.zip

  windows-validation:
    name: Windows PowerShell and real Tk validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test embedded flow patch and package
        shell: powershell
        run: python scripts/test_v0431_embedded_flow.py
      - name: Test real same-window Tk flow
        shell: powershell
        run: python scripts/test_v0431_embedded_flow_tk_runtime.py --require-display
      - name: Parse candidate with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate_windows.ps1 -ManifestPath .\candidate-v0431.json
      - name: Verify deterministic package
        shell: powershell
        run: git diff --exit-code -- candidate-v0431.json release/v0431/SHA256.txt updates/AIArticleStudio_Update_v0.4.3.1_EmbeddedSixStepFlow.zip
