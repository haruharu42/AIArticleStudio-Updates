name: Validate v0.4.2.6 embedded single-item wizard

on:
  pull_request:
    branches: [main]
    paths:
      - 'release/v0426/**'
      - 'candidate-v0426.json'
      - 'updates/AIArticleStudio_Update_v0.4.2.6_EmbeddedSingleItemWizard.zip'
      - 'scripts/test_v0426_embedded_wizard.py'
      - '.github/workflows/build-v0426-embedded-wizard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-validation:
    name: Linux package and workflow validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run embedded wizard regression tests
        run: |
          python scripts/test_v0425_guided_wizard.py
          python scripts/test_v0426_embedded_wizard.py
      - name: Rebuild deterministic package
        run: python release/v0426/build_package.py
      - name: Validate v0.4.2.6 candidate
        run: python scripts/validate_release.py candidate-v0426.json
      - name: Verify committed package is reproducible
        run: git diff --exit-code -- candidate-v0426.json release/v0426/SHA256.txt updates/AIArticleStudio_Update_v0.4.2.6_EmbeddedSingleItemWizard.zip

  windows-validation:
    name: Windows PowerShell 5.1 validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run embedded wizard regression tests
        shell: powershell
        run: |
          python scripts/test_v0425_guided_wizard.py
          python scripts/test_v0426_embedded_wizard.py
      - name: Rebuild deterministic package
        shell: powershell
        run: python release/v0426/build_package.py
      - name: Validate v0.4.2.6 candidate
        shell: powershell
        run: python scripts/validate_release.py candidate-v0426.json
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate_windows.ps1 -ManifestPath .\candidate-v0426.json
      - name: Verify committed package is reproducible
        shell: powershell
        run: git diff --exit-code -- candidate-v0426.json release/v0426/SHA256.txt updates/AIArticleStudio_Update_v0.4.2.6_EmbeddedSingleItemWizard.zip
