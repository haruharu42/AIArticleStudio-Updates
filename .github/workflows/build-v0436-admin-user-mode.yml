name: Validate v0.4.3.6 Admin User Mode

on:
  pull_request:
    branches: [main]
    paths:
      - 'release/v0436/**'
      - 'candidate-v0436.json'
      - 'updates/AIArticleStudio_Update_v0.4.3.6_AdminUserMode.zip'
      - 'src/ai_article_studio/ui/auth_ui.py'
      - 'scripts/test_v0436_admin_user_mode.py'
      - 'scripts/test_v0436_admin_user_mode_tk_runtime.py'
      - 'scripts/test_v0436_update_package.py'
      - '.github/workflows/build-v0436-admin-user-mode.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-validation:
    name: Linux focused and package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Admin User Mode
        run: python scripts/test_v0436_admin_user_mode.py
      - name: Test Tk boundary when display is available
        run: python scripts/test_v0436_admin_user_mode_tk_runtime.py
      - name: Test Admin management and Auth regression
        run: |
          python scripts/test_v0435_admin_user_management.py
          python scripts/test_v0433_auth_foundation.py
          python scripts/test_v0434_google_oauth.py
      - name: Test v0.4.3.5 to v0.4.3.6 update
        run: python scripts/test_v0436_update_package.py
      - name: Verify deterministic package
        run: git diff --exit-code -- candidate-v0436.json release/v0436/SHA256.txt updates/AIArticleStudio_Update_v0.4.3.6_AdminUserMode.zip

  windows-validation:
    name: Windows Tk and updater validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Admin User Mode
        shell: powershell
        run: python scripts/test_v0436_admin_user_mode.py
      - name: Test real Windows Tk buttons and mode switching
        shell: powershell
        run: python scripts/test_v0436_admin_user_mode_tk_runtime.py --require-display
      - name: Test Admin management, DPAPI, and OAuth regression
        shell: powershell
        run: |
          python scripts/test_v0435_admin_user_management.py
          python scripts/test_v0433_auth_foundation.py
          python scripts/test_v0434_google_oauth.py
      - name: Test v0.4.3.5 to v0.4.3.6 update
        shell: powershell
        run: python scripts/test_v0436_update_package.py
      - name: Run Update.ps1 against the real LocalAppData install path
        shell: powershell
        run: |
          $fixtureBase = Join-Path $env:RUNNER_TEMP 'v0436-real-install'
          $appRoot = Join-Path $fixtureBase 'AIArticleStudio'
          $packageRoot = Join-Path $env:RUNNER_TEMP 'v0436-real-package'
          python -c "import pathlib,sys; sys.path.insert(0, str(pathlib.Path.cwd() / 'scripts')); import test_v0436_update_package as test; test.build_v0434_fixture(pathlib.Path(r'$fixtureBase'))"
          python -m venv (Join-Path $appRoot '.venv')
          Expand-Archive -Path '.\updates\AIArticleStudio_Update_v0.4.3.6_AdminUserMode.zip' -DestinationPath $packageRoot -Force
          $authUi = Join-Path $appRoot 'src\ai_article_studio\ui\auth_ui.py'
          $before = (Get-FileHash $authUi -Algorithm SHA256).Hash
          $savedLocalAppData = $env:LOCALAPPDATA
          try {
            $env:LOCALAPPDATA = $fixtureBase
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $packageRoot 'Update.ps1')
          } finally {
            $env:LOCALAPPDATA = $savedLocalAppData
          }
          $after = (Get-FileHash $authUi -Algorithm SHA256).Hash
          $payload = (Get-FileHash (Join-Path $packageRoot 'payload\ui\auth_ui.py') -Algorithm SHA256).Hash
          if ($before -eq $after) { throw 'Installed auth_ui.py was not replaced.' }
          if ($after -ne $payload) { throw 'Installed auth_ui.py does not match the ZIP payload.' }
          foreach ($pattern in @('ui_mode', 'ユーザーモードへ', '管理者モードへ')) {
            if (-not (Select-String -Path $authUi -Pattern $pattern -Quiet)) { throw "Installed auth_ui.py is missing: $pattern" }
          }
          & (Join-Path $appRoot '.venv\Scripts\python.exe') (Join-Path $packageRoot 'validate_v0436.py') $appRoot
      - name: Parse candidate with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate_windows.ps1 -ManifestPath .\candidate-v0436.json
      - name: Verify deterministic package
        shell: powershell
        run: git diff --exit-code -- candidate-v0436.json release/v0436/SHA256.txt updates/AIArticleStudio_Update_v0.4.3.6_AdminUserMode.zip
