name: Validate v0.4.3.3 Auth UI Foundation

on:
  pull_request:
    branches: [main]
    paths:
      - 'release/v0433/**'
      - 'candidate-v0433.json'
      - 'updates/AIArticleStudio_Update_v0.4.3.3_AuthUIFoundation.zip'
      - 'supabase/migrations/202608230001_phase_auth_ui_foundation.sql'
      - 'config/auth.example.json'
      - 'docs/AUTH_UI_FOUNDATION.md'
      - '.github/workflows/build-v0433-auth-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-validation:
    name: Linux auth core, patch, and package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Auth/UI foundation
        run: python scripts/test_v0433_auth_foundation.py
      - name: Test UI when display is available
        run: python scripts/test_v0433_auth_ui_tk_runtime.py
      - name: Validate immutable v0.4.3.3 package
        run: python scripts/validate_release.py candidate-v0433.json

  windows-validation:
    name: Windows DPAPI, PowerShell, and real Tk validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Auth/UI foundation
        shell: powershell
        run: python scripts/test_v0433_auth_foundation.py
      - name: Test real Auth UI
        shell: powershell
        run: python scripts/test_v0433_auth_ui_tk_runtime.py --require-display
      - name: Validate immutable v0.4.3.3 package
        shell: powershell
        run: python scripts/validate_release.py candidate-v0433.json
      - name: Parse candidate with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate_windows.ps1 -ManifestPath .\candidate-v0433.json
