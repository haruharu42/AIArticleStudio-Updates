name: "Preview Cloudflare診断"
run-name: "Preview Cloudflare診断 • PR #${{ github.event.issue.number }}"

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  diagnose-preview-cloudflare:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/diagnose-preview' &&
      github.actor == github.repository_owner &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AAS_CLOUDFLARE_WORKER_NAME: ai-article-studio-pwa-preview
      WRANGLER_WRITE_LOGS: "false"

    steps:
      - name: Validate required credentials are present
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Required GitHub Actions secret is unavailable: $name" >&2
              exit 1
            fi
          done
          echo 'Cloudflare credentials are present; values were not printed.'

      - name: Verify configured Account ID is accessible to token
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/cloudflare-account-check.json"
          http_code="$(curl -sS -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")"

          ACCOUNT_CHECK_FILE="$body" HTTP_CODE="$http_code" node - <<'NODE'
          const fs = require('fs');
          const file = process.env.ACCOUNT_CHECK_FILE;
          const httpCode = process.env.HTTP_CODE;
          let payload = null;
          try {
            payload = JSON.parse(fs.readFileSync(file, 'utf8'));
          } catch (_) {}
          if (httpCode !== '200' || payload?.success !== true) {
            console.error(`Configured Cloudflare Account ID is not accessible to this token (HTTP ${httpCode}).`);
            process.exit(1);
          }
          console.log('Cloudflare Account ID/token binding: PASS');
          NODE
          rm -f "$body"

      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install locked PWA dependencies
        working-directory: pwa
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify Cloudflare authentication
        working-directory: pwa
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler whoami --json >/dev/null
          echo 'Wrangler authentication: PASS'

      - name: Classify Preview Worker visibility
        working-directory: pwa
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(npx wrangler versions list \
            --name "$AAS_CLOUDFLARE_WORKER_NAME" \
            --json 2>&1)"
          exit_code=$?
          set -e

          if [ "$exit_code" -eq 0 ]; then
            echo 'Preview Worker status: EXISTS'
            {
              echo '## Cloudflare Preview diagnostic'
              echo
              echo '- Account ID/token binding: PASS'
              echo '- Wrangler authentication: PASS'
              echo '- Preview Worker: EXISTS'
              echo '- Cloudflare write operations: NONE'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if printf '%s' "$output" | grep -Eqi '(^|[^0-9])404([^0-9]|$)|code[^0-9]*10090|not found|does not exist|could not find|couldn.t find|no worker|worker.+missing|script.+missing'; then
            echo 'Preview Worker status: NOT_FOUND'
            {
              echo '## Cloudflare Preview diagnostic'
              echo
              echo '- Account ID/token binding: PASS'
              echo '- Wrangler authentication: PASS'
              echo '- Preview Worker: NOT_FOUND'
              echo '- Cloudflare write operations: NONE'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if printf '%s' "$output" | grep -Eqi 'unauthorized|forbidden|permission|authentication|token|login'; then
            echo 'Preview Worker status: PERMISSION_ERROR' >&2
            echo 'Raw Cloudflare response was intentionally not printed.' >&2
            exit 1
          fi

          echo "Preview Worker status: UNEXPECTED_ERROR (native exit $exit_code)" >&2
          echo 'Raw Cloudflare response was intentionally not printed.' >&2
          exit 1
