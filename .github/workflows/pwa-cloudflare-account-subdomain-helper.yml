name: PWA Cloudflare Account Subdomain Helper

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/Configure-AAS-Cloudflare-Account-Subdomain.ps1"
      - ".github/workflows/pwa-cloudflare-account-subdomain-helper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-helper-safety:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell 5.1 syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = '.\scripts\Configure-AAS-Cloudflare-Account-Subdomain.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List
            throw 'Account-subdomain helper has PowerShell syntax errors'
          }
          Write-Host 'PowerShell 5.1 syntax: PASS'

      - name: Validate guarded account-wide write
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content -LiteralPath '.\scripts\Configure-AAS-Cloudflare-Account-Subdomain.ps1' -Raw -Encoding UTF8

          if ($source -notmatch 'ConfirmCreateAccountSubdomain') {
            throw 'Helper must require an explicit confirmation switch'
          }
          if ($source -notmatch '/workers/subdomain') {
            throw 'Helper must use the account workers.dev subdomain API'
          }
          if ($source -notmatch '(?i)-Method\s+Put') {
            throw 'Helper must make the account-subdomain write explicit'
          }
          if ($source -notmatch 'production workers.dev route is enabled') {
            throw 'Helper must refuse when the Worker production workers.dev route is enabled'
          }
          if ($source -notmatch 'Preview URLs are disabled') {
            throw 'Helper must require Preview URLs to remain enabled'
          }
          if ($source -notmatch 'Refusing to rename an existing account-wide workers.dev subdomain') {
            throw 'Helper must refuse to rename a pre-existing account-wide subdomain'
          }
          if ($source -match '(?s)"versions"\s*,\s*"upload"') {
            throw 'Account-subdomain helper must not upload Worker versions'
          }
          if ($source -match '(?i)&\s+\$Wrangler\s+deploy\b') {
            throw 'Account-subdomain helper must not deploy a Worker'
          }
          if ($source -match '(?i)service[_-]?role|sb_secret_') {
            throw 'Account-subdomain helper contains a forbidden secret marker'
          }

          Write-Host 'Guarded account-wide write contract: PASS'
