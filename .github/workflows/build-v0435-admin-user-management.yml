name: Validate v0.4.3.5 Admin user management

on:
  pull_request:
    branches: [main]
    paths:
      - 'release/v0435/**'
      - 'candidate-v0435.json'
      - 'updates/AIArticleStudio_Update_v0.4.3.5_AdminUserManagement.zip'
      - '.github/workflows/build-v0435-admin-user-management.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-validation:
    name: Linux user management and package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Admin user management
        run: python scripts/test_v0435_admin_user_management.py
      - name: Test Admin GUI boundary
        run: python scripts/test_v0435_admin_user_management_tk_runtime.py
      - name: Test Auth and Google OAuth regression
        run: |
          python scripts/test_v0433_auth_foundation.py
          python scripts/test_v0434_google_oauth.py
      - name: Validate immutable release
        run: python scripts/validate_release.py candidate-v0435.json

  windows-validation:
    name: Windows Admin GUI and updater validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Admin user management
        shell: powershell
        run: python scripts/test_v0435_admin_user_management.py
      - name: Test Admin GUI runtime
        shell: powershell
        run: python scripts/test_v0435_admin_user_management_tk_runtime.py --require-display
      - name: Test Auth, DPAPI, and Google OAuth regression
        shell: powershell
        run: |
          python scripts/test_v0433_auth_foundation.py
          python scripts/test_v0434_google_oauth.py
      - name: Validate immutable release
        shell: powershell
        run: python scripts/validate_release.py candidate-v0435.json
      - name: Parse candidate with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate_windows.ps1 -ManifestPath .\candidate-v0435.json
