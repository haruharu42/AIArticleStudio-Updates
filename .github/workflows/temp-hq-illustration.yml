name: Temporary HQ illustration assembly

on:
  push:
    branches:
      - fix/hq-illustrations-20260924
    paths:
      - ".tmp-hq-illustration/**"
      - ".github/workflows/temp-hq-illustration.yml"

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hq-illustrations-20260924
          fetch-depth: 0

      - name: Assemble and verify WebP
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp-hq-illustration/part*.b64 > /tmp/aas-hq.b64
          base64 --decode /tmp/aas-hq.b64 > pwa/public/aas-axia-rumo-hero-hq.webp
          test "$(wc -c < pwa/public/aas-axia-rumo-hero-hq.webp)" -eq 46496
          echo "2382e70dc7848f1d2022d4c39a6497b4f5d783f81d86e8b27be28ffbc02f192a  pwa/public/aas-axia-rumo-hero-hq.webp" | sha256sum --check -

      - name: Commit asset and remove temporary payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-hq-illustration
          rm -f .github/workflows/temp-hq-illustration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "assets: add high-resolution Axia Rumo illustration"
          git push origin HEAD:fix/hq-illustrations-20260924
