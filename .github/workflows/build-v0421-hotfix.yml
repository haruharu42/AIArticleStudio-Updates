name: Build v0.4.2.1 image settings hotfix

on:
  pull_request:
    branches: [main]
    paths:
      - 'release/v0421/**'
      - 'scripts/test_v0421_hotfix.py'
      - '.github/workflows/build-v0421-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-build-and-commit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'hotfix-v0421-image-settings-visible' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test hotfix
        run: python scripts/test_v0421_hotfix.py
      - name: Build deterministic package
        run: python release/v0421/build_package.py
      - name: Validate candidate package
        run: python scripts/validate_release.py candidate-v0421.json
      - name: Rebuild and verify deterministic SHA
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$(python - <<'PY'
          import json
          print(json.load(open('candidate-v0421.json', encoding='utf-8'))['sha256'])
          PY
          )
          python release/v0421/build_package.py >/dev/null
          SECOND=$(python - <<'PY'
          import json
          print(json.load(open('candidate-v0421.json', encoding='utf-8'))['sha256'])
          PY
          )
          test "$FIRST" = "$SECOND"
      - name: Commit generated package and manifest
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/AIArticleStudio_Update_v0.4.2.1_ImageSettingsVisible.zip candidate-v0421.json release/v0421/SHA256.txt
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Build v0.4.2.1 image settings hotfix package"
          git push origin HEAD:${{ github.head_ref }}

  windows-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test hotfix
        shell: powershell
        run: python scripts/test_v0421_hotfix.py
      - name: Build deterministic package
        shell: powershell
        run: python release/v0421/build_package.py
      - name: Validate package
        shell: powershell
        run: python scripts/validate_release.py candidate-v0421.json
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate_windows.ps1 -ManifestPath .\candidate-v0421.json
