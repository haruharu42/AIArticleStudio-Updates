name: "🚀 Member Betaへデプロイ"
run-name: "🚀 Member Beta • ${{ inputs.expected_sha }}"

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "noteメンバー向け本番へ出す40文字のmainコミットSHA"
        required: true
        type: string
      confirmation:
        description: "workers.dev本番公開を確認するには DEPLOY_MEMBER_BETA と入力"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pwa-member-beta-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pwa
    env:
      NEXT_PUBLIC_AAS_SUPABASE_URL: ${{ secrets.AAS_PREVIEW_SUPABASE_URL }}
      NEXT_PUBLIC_AAS_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.AAS_PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_AAS_TERMS_URL: /terms
      NEXT_PUBLIC_AAS_PRIVACY_URL: /privacy
      NEXT_PUBLIC_AAS_AI_TERMS_URL: /ai-terms
      NEXT_PUBLIC_AAS_RELEASE_AUDIENCE: public
      AAS_CLOUDFLARE_WORKER_NAME: ai-article-studio-pwa
      AAS_CLOUDFLARE_PUBLIC_WORKERS_DEV: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_WRITE_LOGS: "false"

    steps:
      - name: Resolve and validate production SHA
        id: target
        shell: bash
        working-directory: .
        env:
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "DEPLOY_MEMBER_BETA" ]; then
            echo 'Member Beta deploy requires confirmation text DEPLOY_MEMBER_BETA.' >&2
            exit 1
          fi
          if [ "$EVENT_REF" != "refs/heads/main" ]; then
            echo 'Member Beta deploy may only run from main.' >&2
            exit 1
          fi
          if [ "$EVENT_SHA" != "$INPUT_EXPECTED_SHA" ]; then
            echo 'Selected main ref does not match expected_sha.' >&2
            exit 1
          fi
          if ! printf '%s' "$INPUT_EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo 'Production SHA must be an exact lowercase 40-character Git commit SHA.' >&2
            exit 1
          fi
          echo "sha=$INPUT_EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "Pinned Member Beta SHA validated: $INPUT_EXPECTED_SHA"

      - name: Validate required Actions secrets
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          for name in NEXT_PUBLIC_AAS_SUPABASE_URL NEXT_PUBLIC_AAS_SUPABASE_PUBLISHABLE_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Required GitHub Actions secret is unavailable: $name" >&2
              exit 1
            fi
          done
          if ! printf '%s' "$NEXT_PUBLIC_AAS_SUPABASE_URL" | grep -Eq '^https://[^[:space:]]+$'; then
            echo 'Supabase URL must be HTTPS.' >&2
            exit 1
          fi
          if printf '%s' "$NEXT_PUBLIC_AAS_SUPABASE_PUBLISHABLE_KEY" | grep -Eqi 'sb_secret_|service[_-]?role'; then
            echo 'Forbidden Supabase secret/service-role material detected.' >&2
            exit 1
          fi

      - name: Checkout exact selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        shell: bash
        working-directory: .
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build and regression tests
        env:
          NEXT_PUBLIC_AAS_BUILD_SHA: ${{ steps.target.outputs.sha }}
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Validate legal and PWA assets
        shell: bash
        run: |
          set -euo pipefail
          test -f public/manifest.webmanifest
          test -f public/icon-192.png
          test -f public/icon-512.png
          test -f public/sw.js
          test -f app/terms/page.tsx
          test -f app/privacy/page.tsx
          test -f app/ai-terms/page.tsx
          test -f app/commercial-transactions/page.tsx
          test -f app/support/page.tsx
          grep -Fq '/auth/callback' public/sw.js
          grep -Fq '/api/' public/sw.js
          grep -Fq 'access_token' public/sw.js
          grep -Fq 'refresh_token' public/sw.js

      - name: Locate generated Wrangler deployment config
        id: wrangler-config
        shell: bash
        run: |
          set -euo pipefail
          config="$(find . -path './node_modules' -prune -o -path './.wrangler' -prune -o -name wrangler.json -type f -print | head -n 1)"
          if [ -z "$config" ]; then
            echo 'Generated wrangler.json was not found after build.' >&2
            exit 1
          fi
          echo "config=$config" >> "$GITHUB_OUTPUT"

      - name: Verify Member Beta Cloudflare contract
        shell: bash
        env:
          CONFIG_PATH: ${{ steps.wrangler-config.outputs.config }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync(process.env.CONFIG_PATH, 'utf8'));
          if (config.name !== 'ai-article-studio-pwa') throw new Error('Unexpected production Worker name: ' + (config.name ?? '<missing>'));
          if (!config.compatibility_date) throw new Error('compatibility_date missing');
          if (config.workers_dev !== true) throw new Error('workers_dev must be true for Member Beta');
          if (config.preview_urls !== false) throw new Error('preview_urls must be false for Member Beta');
          if (config.assets?.binding !== 'ASSETS') throw new Error('ASSETS binding missing');
          const imagesBinding = Array.isArray(config.images)
            ? config.images.some((item) => item?.binding === 'IMAGES')
            : config.images?.binding === 'IMAGES';
          if (!imagesBinding) throw new Error('IMAGES binding missing');
          if (config.route || (Array.isArray(config.routes) && config.routes.length > 0)) {
            throw new Error('Custom production routes/domains must remain absent in Member Beta');
          }
          const serialized = JSON.stringify(config);
          if (/sb_secret_|service[_-]?role/i.test(serialized)) throw new Error('Forbidden secret/service-role marker found');
          console.log('Member Beta Cloudflare contract: PASS');
          NODE

      - name: Verify Cloudflare authentication
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler whoami --json >/dev/null

      - name: Wrangler deployment dry-run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .member-beta-dry-run
          npx wrangler deploy --dry-run --config "${{ steps.wrangler-config.outputs.config }}" --outdir .member-beta-dry-run
          test -d .member-beta-dry-run

      - name: Deploy Member Beta production Worker
        id: deploy
        shell: bash
        env:
          CONFIG_PATH: ${{ steps.wrangler-config.outputs.config }}
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/aas-member-beta-deploy.txt"
          npx wrangler deploy --config "$CONFIG_PATH" --keep-vars --message "AAS PWA member beta $GITHUB_SHA" 2>&1 | tee "$output_file"
          production_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev[^[:space:]]*' "$output_file" | tail -n 1 || true)"
          production_url="${production_url%\)}"
          production_url="${production_url%\]}"
          if [ -z "$production_url" ]; then
            echo 'Wrangler deploy succeeded but production workers.dev URL could not be parsed.' >&2
            exit 1
          fi
          echo "production_url=$production_url" >> "$GITHUB_OUTPUT"
          echo "Member Beta URL: $production_url"

      - name: Write Member Beta deployment summary
        if: ${{ success() }}
        shell: bash
        working-directory: .
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          {
            echo '## AI Article Studio PWA — note Member Beta'
            echo
            echo "- SHA: $EXPECTED_SHA"
            echo '- Worker: ai-article-studio-pwa'
            echo "- workers.dev URL: $PRODUCTION_URL"
            echo '- Preview Worker remains separate and unchanged'
            echo '- Custom domain / DNS: not modified'
            echo '- Stripe LIVE: not modified'
            echo '- Windows updater / release / latest.json: not modified'
          } >> "$GITHUB_STEP_SUMMARY"
