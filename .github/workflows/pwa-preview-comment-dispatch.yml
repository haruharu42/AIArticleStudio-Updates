name: "Preview deploy command"

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  pull-requests: read
  issues: read

jobs:
  dispatch-preview:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/deploy-preview' &&
      github.actor == github.repository_owner &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch guarded Preview workflow for PR HEAD
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.issue.number;

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
            });

            if (pr.state !== 'open') {
              core.setFailed(`PR #${pull_number} is not open.`);
              return;
            }

            if (!pr.head.repo || pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.setFailed('Preview deploy commands only support branches in this repository.');
              return;
            }

            const ref = pr.head.ref;
            const expectedSha = pr.head.sha;

            if (!/^[0-9a-f]{40}$/.test(expectedSha)) {
              core.setFailed(`Unexpected PR HEAD SHA: ${expectedSha}`);
              return;
            }

            core.info(`Dispatching Preview workflow for PR #${pull_number}`);
            core.info(`Ref: ${ref}`);
            core.info(`SHA: ${expectedSha}`);

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'pwa-preview-deploy.yml',
              ref,
              inputs: {
                expected_sha: expectedSha,
                confirmation: 'DEPLOY_PREVIEW',
              },
            });

            core.notice(`Preview dispatch requested for ${expectedSha}.`);
