name: Validate v0.4.3.4 Google OAuth fix

on:
  pull_request:
    branches: [main]
    paths:
      - 'release/v0434/**'
      - 'candidate-v0434.json'
      - 'updates/AIArticleStudio_Update_v0.4.3.4_GoogleOAuthFix.zip'
      - 'src/ai_article_studio/core/auth_service.py'
      - 'scripts/test_v0433_auth_foundation.py'
      - 'scripts/test_v0434_google_oauth.py'
      - 'scripts/test_v0434_update_package.py'
      - '.github/workflows/build-v0434-google-oauth-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-validation:
    name: Linux OAuth, Auth regression, and package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Google OAuth PKCE hotfix
        run: python scripts/test_v0434_google_oauth.py
      - name: Test Email Password and session regression
        run: python scripts/test_v0433_auth_foundation.py
      - name: Test cumulative update paths and package
        run: python scripts/test_v0434_update_package.py
      - name: Verify deterministic package
        run: git diff --exit-code -- candidate-v0434.json release/v0434/SHA256.txt updates/AIArticleStudio_Update_v0.4.3.4_GoogleOAuthFix.zip

  windows-validation:
    name: Windows PowerShell and OAuth callback validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Google OAuth PKCE hotfix
        shell: powershell
        run: python scripts/test_v0434_google_oauth.py
      - name: Test Email Password, DPAPI, and session regression
        shell: powershell
        run: python scripts/test_v0433_auth_foundation.py
      - name: Test cumulative update paths and package
        shell: powershell
        run: python scripts/test_v0434_update_package.py
      - name: Parse candidate with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate_windows.ps1 -ManifestPath .\candidate-v0434.json
      - name: Verify deterministic package
        shell: powershell
        run: git diff --exit-code -- candidate-v0434.json release/v0434/SHA256.txt updates/AIArticleStudio_Update_v0.4.3.4_GoogleOAuthFix.zip
