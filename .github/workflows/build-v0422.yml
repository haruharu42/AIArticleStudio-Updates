name: Build v0.4.2.2 article-linked images

on:
  pull_request:
    branches: [main]
    paths:
      - 'release/v0422/**'
      - 'src/ai_article_studio/core/image_settings.py'
      - 'src/ai_article_studio/core/image_prompt_builder.py'
      - 'src/ai_article_studio/core/web_ai_workflow.py'
      - 'src/ai_article_studio/core/web_ai_ui_bridge.py'
      - 'scripts/test_v0422_image_linkage.py'
      - '.github/workflows/build-v0422.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-build-and-commit:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'feature-v0422-') || startsWith(github.head_ref, 'release-v0422')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'feature-v0422-image-article-linkage' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test existing Phase 3.6 core
        run: python scripts/test_phase36_complete.py
      - name: Test v0.4.2.2 article linkage
        run: python scripts/test_v0422_image_linkage.py
      - name: Build deterministic package
        run: python release/v0422/build_package.py
      - name: Validate candidate package
        run: python scripts/validate_release.py candidate-v0422.json
      - name: Rebuild and verify deterministic SHA
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$(python - <<'PY'
          import json
          print(json.load(open('candidate-v0422.json', encoding='utf-8'))['sha256'])
          PY
          )
          python release/v0422/build_package.py >/dev/null
          SECOND=$(python - <<'PY'
          import json
          print(json.load(open('candidate-v0422.json', encoding='utf-8'))['sha256'])
          PY
          )
          test "$FIRST" = "$SECOND"
      - name: Commit generated package and manifest
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/AIArticleStudio_Update_v0.4.2.2_ArticleLinkedImages.zip candidate-v0422.json release/v0422/SHA256.txt
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Build v0.4.2.2 article-linked image package"
          git push origin HEAD:${{ github.head_ref }}

  windows-validation:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'feature-v0422-') || startsWith(github.head_ref, 'release-v0422')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test existing Phase 3.6 core
        shell: powershell
        run: python scripts/test_phase36_complete.py
      - name: Test v0.4.2.2 article linkage
        shell: powershell
        run: python scripts/test_v0422_image_linkage.py
      - name: Build deterministic package
        shell: powershell
        run: python release/v0422/build_package.py
      - name: Validate package
        shell: powershell
        run: python scripts/validate_release.py candidate-v0422.json
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate_windows.ps1 -ManifestPath .\candidate-v0422.json
