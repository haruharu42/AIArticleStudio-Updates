name: PWA Phase 9-17 CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "pwa/**"
      - "supabase/migrations/**"
      - "docs/phase9-11-implementation-batch.md"
      - "docs/phase12-17-implementation-batch.md"
      - ".github/workflows/pwa-phase9-17-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-phase9-17-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pwa-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pwa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Production readiness preflight
        env:
          AAS_PWA_PRODUCTION_ORIGIN: https://aas-pwa-ci.example.com
          NEXT_PUBLIC_AAS_SUPABASE_URL: https://aas-pwa-ci.supabase.co
          NEXT_PUBLIC_AAS_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_AAS_TERMS_URL: https://legal.example.com/terms
          NEXT_PUBLIC_AAS_PRIVACY_URL: https://legal.example.com/privacy
          NEXT_PUBLIC_AAS_AI_TERMS_URL: https://legal.example.com/ai-terms
        run: npm run production:preflight

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build and regression tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high
